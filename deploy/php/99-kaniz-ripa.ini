; PHP settings for Kaniz Ripa Overseas.
; Install to both FPM and CLI:
;   sudo cp deploy/php/99-kaniz-ripa.ini /etc/php/8.5/fpm/conf.d/
;   sudo cp deploy/php/99-kaniz-ripa.ini /etc/php/8.5/cli/conf.d/
;   sudo systemctl restart php8.5-fpm

; Uploads: images ≤ 8 MB, company profile PDF ≤ 20 MB.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60
expose_php = Off
date.timezone = Asia/Dhaka

; OPcache — deploy.sh reloads PHP-FPM after each release.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
