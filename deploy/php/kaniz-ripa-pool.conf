; Dedicated PHP-FPM pool: the app runs as its own user "kaniz" (also the deploy user),
; isolated from other sites and from www-data. Nginx talks to it over a socket.
;   sudo cp deploy/php/kaniz-ripa-pool.conf /etc/php/8.5/fpm/pool.d/kaniz-ripa.conf
;   sudo systemctl reload php8.5-fpm
[kaniz-ripa]
user = kaniz
group = kaniz
listen = /run/php/kaniz-ripa.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

php_admin_value[open_basedir] = /var/www/kaniz-ripa:/tmp:/usr/share/php:/usr/bin
php_admin_value[disable_functions] = passthru,shell_exec,system,popen,pcntl_exec
php_admin_flag[log_errors] = on
