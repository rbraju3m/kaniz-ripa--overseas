; Queue worker (company profile PDF generation runs on the queue).
;   sudo cp deploy/supervisor/kaniz-ripa-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start kaniz-ripa-worker:*
[program:kaniz-ripa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kaniz-ripa/current/artisan queue:work database --sleep=3 --tries=2 --timeout=180 --max-time=3600 --memory=256
directory=/var/www/kaniz-ripa/current
user=kaniz
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=200
environment=HOME="/var/www/kaniz-ripa/shared/chrome-home"
redirect_stderr=true
stdout_logfile=/var/www/kaniz-ripa/shared/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
