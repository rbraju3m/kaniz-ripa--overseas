# Nginx site for Kaniz Ripa Overseas (Ubuntu 24.04, PHP-FPM).
# Replace YOUR-DOMAIN.com, then:
#   sudo ln -s /etc/nginx/sites-available/kaniz-ripa.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: sudo certbot --nginx -d YOUR-DOMAIN.com -d www.YOUR-DOMAIN.com

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://YOUR-DOMAIN.com$request_uri; }
}

# Redirect www → apex (single canonical host for SEO and Sanctum).
server {
    # Ubuntu 24.04 ships Nginx 1.24, which needs "http2" on the listen line.
    # On Nginx ≥ 1.25.1 use "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.YOUR-DOMAIN.com;
    ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.com/privkey.pem;
    return 301 https://YOUR-DOMAIN.com$request_uri;
}

server {
    # Ubuntu 24.04 ships Nginx 1.24, which needs "http2" on the listen line.
    # On Nginx ≥ 1.25.1 use "listen 443 ssl;" plus "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR-DOMAIN.com;

    # Atomic deploys switch this symlink (see deploy/deploy.sh).
    root /var/www/kaniz-ripa/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/YOUR-DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Company profile PDF uploads are capped at 20 MB by the app.
    client_max_body_size 25m;

    # Security headers (Laravel also sends these plus a nonce-based CSP on HTML).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression — essential for performance (see docs/TESTING.md).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Vite build: content-hashed, cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # Public uploads (random names). Never execute anything here.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; access_log off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/kaniz-ripa.sock;   # dedicated pool (deploy/php/kaniz-ripa-pool.conf)
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink so each release uses its own OPcache entries.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block every other PHP file and hidden files (.env, .git …).
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    access_log /var/log/nginx/kaniz-ripa.access.log;
    error_log  /var/log/nginx/kaniz-ripa.error.log warn;
}
